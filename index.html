<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#eef2ff" />
<title>智能刷题器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    margin:0;padding:18px 12px calc(70px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 45%,#ecfeff 100%);
    min-height:100vh;color:#1e293b;-webkit-font-smoothing:antialiased;
  }
  /* iOS Safari 地址栏收展时高度稳定 */
  @supports (height:100dvh){
    body{min-height:100dvh;}
  }
  /* 老版 iOS（不支持 dvh）回退 */
  @supports (-webkit-touch-callout:none) and (not (height:100dvh)){
    body{min-height:-webkit-fill-available;}
  }
  body{-webkit-tap-highlight-color:transparent;}
  /* 触屏交互：消除点击高亮与 300ms 延迟 */
  button,input,.option,.close,label{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:880px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  header h1{
    margin:0 0 6px;font-size:26px;letter-spacing:1px;
    background:linear-gradient(90deg,#4f46e5,#0ea5e9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{margin:0;font-size:13px;color:#64748b;}

  .card{
    background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;
    box-shadow:0 4px 18px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.85);
  }

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .row + .row{margin-top:12px;}

  .btn{
    border:1px solid #e2e8f0;background:#fff;color:#334155;padding:9px 16px;
    border-radius:10px;font-size:14px;cursor:pointer;transition:.18s;font-weight:500;
    font-family:inherit;white-space:nowrap;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.primary{
    background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;
    box-shadow:0 4px 12px rgba(79,70,229,.28);
  }
  .btn.success{
    background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;
    box-shadow:0 4px 12px rgba(22,163,74,.25);
  }
  .btn.ghost{background:#f8fafc;}
  .btn.danger{background:#fef2f2;color:#dc2626;border-color:#fecaca;}

  .field{display:flex;align-items:center;gap:8px;}
  .field label{font-size:13px;color:#475569;white-space:nowrap;}
  input[type=text],input[type=number]{
    border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:14px;
    width:110px;outline:none;transition:.18s;font-family:inherit;background:#fff;color:#1e293b;
  }
  input[type=text]:focus,input[type=number]:focus{
    border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.13);
  }

  .bank-info{font-size:13px;color:#94a3b8;}
  .bank-info.ok{color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;padding:6px 12px;border-radius:999px;}

  .empty-tip{text-align:center;color:#64748b;line-height:1.9;}
  .empty-tip .small{font-size:12px;color:#94a3b8;line-height:1.8;}

  /* 题目区 */
  .quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .progress{font-size:14px;color:#64748b;font-weight:600;}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600;}
  .tag.single{background:#eef2ff;color:#4f46e5;}
  .tag.multi{background:#fef3c7;color:#b45309;}
  .tag.judge{background:#e0f2fe;color:#0369a1;}

  .bar{height:6px;background:#f1f5f9;border-radius:999px;overflow:hidden;margin-bottom:16px;}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#818cf8,#4f46e5);transition:width .3s;}

  .stem{font-size:17px;line-height:1.75;font-weight:600;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}

  .option{
    display:flex;align-items:flex-start;gap:11px;padding:12px 14px;margin-bottom:10px;
    border:2px solid #e2e8f0;border-radius:12px;background:#fff;cursor:pointer;
    transition:.15s;user-select:none;-webkit-user-select:none;
  }
  .option input{margin:3px 0 0;width:16px;height:16px;accent-color:#4f46e5;cursor:pointer;flex:0 0 auto;}
  .option input:disabled{cursor:default;}
  .opt-label{
    flex:0 0 24px;height:24px;border-radius:50%;background:#eef2ff;color:#4f46e5;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  }
  .opt-text{flex:1;font-size:15px;line-height:1.6;word-break:break-word;padding-top:1px;}
  .option.correct{border-color:#22c55e;background:#f0fdf4;}
  .option.correct .opt-label{background:#22c55e;color:#fff;}
  .option.wrong{border-color:#ef4444;background:#fef2f2;}
  .option.wrong .opt-label{background:#ef4444;color:#fff;}

  .feedback{margin-top:6px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6;}
  .feedback.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
  .feedback.bad{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}

  .actions{display:flex;gap:12px;margin-top:16px;}
  .actions .btn{flex:1;padding:12px;font-size:15px;}

  /* 结果 */
  .result{text-align:center;padding:30px 18px;}
  .result h2{margin:0 0 14px;font-size:20px;color:#1e293b;}
  .score-line{font-size:15px;color:#64748b;}
  .score-line .score{font-size:48px;font-weight:800;color:#4f46e5;vertical-align:-4px;}
  .rate{font-size:16px;color:#0f766e;font-weight:600;margin:8px 0 6px;}
  .result-meta{font-size:12px;color:#94a3b8;margin-bottom:20px;}

  /* 弹窗 */
  .modal{
    position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
    align-items:center;justify-content:center;z-index:100;
    padding:16px;padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));
    padding-top:max(16px,env(safe-area-inset-top));
    padding-bottom:max(16px,env(safe-area-inset-bottom));
    backdrop-filter:blur(2px);
  }
  .modal-box{
    background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:82vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.25);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #f1f5f9;}
  .modal-head h3{margin:0;font-size:16px;}
  .close{border:none;background:none;font-size:24px;line-height:1;color:#94a3b8;cursor:pointer;padding:0 4px;}
  .modal-body{padding:14px 18px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .modal-foot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid #f1f5f9;}
  .modal-foot .btn{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
  th{background:#f8fafc;color:#64748b;font-weight:600;position:sticky;top:0;}

  /* 仅在支持 hover 的设备（桌面）启用 hover 效果，避免触屏粘滞 */
  @media (hover:hover) and (pointer:fine){
    .btn:hover{background:#f1f5f9;border-color:#cbd5e1;}
    .btn:disabled:hover{background:#fff;border-color:#e2e8f0;}
    .btn.primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,#6366f1,#4f46e5);}
    .btn.success:hover{filter:brightness(1.08);background:linear-gradient(135deg,#22c55e,#16a34a);}
    .btn.danger:hover{background:#fee2e2;}
    .option:hover{border-color:#c7d2fe;background:#f8faff;}
    .close:hover{color:#475569;}
    tbody tr:hover{background:#fafbff;}
  }

  .toast{
    position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:rgba(30,41,59,.94);color:#fff;padding:11px 22px;border-radius:999px;
    font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:200;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .loading{
    position:fixed;inset:0;background:rgba(248,250,252,.85);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;
    font-size:14px;color:#475569;backdrop-filter:blur(2px);
  }
  .spinner{
    width:38px;height:38px;border:3px solid #e2e8f0;border-top-color:#4f46e5;
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}

  @media (max-width:520px){
    body{padding-left:10px;padding-right:10px;}
    .field{flex:1 1 100%;}
    /* 输入框 16px 防 iOS 聚焦自动缩放 */
    input[type=text],input[type=number]{flex:1;width:auto;font-size:16px;padding:10px 12px;}
    .row .btn{flex:1 1 auto;}
    /* 触控目标 ≥44px（Apple HIG） */
    .btn{padding:12px 18px;min-height:44px;font-size:15px;}
    .field .btn{padding:10px 16px;}
    .option{padding:13px 14px;min-height:44px;}
    .option input{width:18px;height:18px;margin-top:2px;}
    .actions .btn{padding:13px 10px;min-height:48px;font-size:16px;}
    .actions{gap:10px;}
    .stem{font-size:17px;line-height:1.8;}
    .opt-text{font-size:15px;line-height:1.65;}
    .modal-box{width:92vw;max-height:85dvh;}
    /* 记录表横向可滚动 */
    .modal-body{padding:12px 12px calc(12px + env(safe-area-inset-bottom));}
    table{min-width:480px;}
    header h1{font-size:22px;}
  }
  /* 横屏刘海安全区（iPhone landscape 左右留白） */
  @media (max-width:920px) and (orientation:landscape){
    .wrap{padding-left:calc(0px + env(safe-area-inset-left));padding-right:calc(0px + env(safe-area-inset-right));}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>智能刷题器</h1>
    <p class="sub">支持 Excel / PDF / Word 题库 · 自动记忆 · 成绩记录</p>
  </header>

  <!-- 工具栏 -->
  <div class="card toolbar">
    <div class="row">
      <button id="btnUpload" class="btn primary">📁 上传 / 更换题库</button>
      <span id="bankInfo" class="bank-info">尚未加载题库</span>
    </div>
    <div class="row">
      <div class="field">
        <label>姓名</label>
        <input id="nameInput" type="text" maxlength="20" placeholder="匿名" />
        <button id="btnName" class="btn">确定</button>
      </div>
      <div class="field">
        <label>练习数量</label>
        <input id="countInput" type="number" min="1" value="10" />
        <button id="btnCount" class="btn">确定</button>
      </div>
      <button id="btnRecords" class="btn ghost">📊 做题记录</button>
    </div>
    <div class="row">
      <label style="font-size:13px;color:#475569;margin-right:4px;">刷题模式：</label>
      <button id="btnModeRandom" class="btn primary">🎲 随机刷题</button>
      <button id="btnModeSeq" class="btn">📖 顺序刷题</button>
      <span id="modeInfo" class="bank-info"></span>
    </div>
  </div>

  <!-- 空状态 -->
  <div id="emptyTip" class="card empty-tip">
    <p>👋 还没有题库，点击上方「上传 / 更换题库」开始吧</p>
    <p class="small">
      <b>Excel</b>：第一行为标题，之后每行为「题目、A、B、C、D、E、答案」，空白选项自动隐藏。<br>
      <b>PDF / Word</b>：需为文字版（非扫描图片），题目含题号、A/B/C/D 选项行与「答案：X」行。
    </p>
  </div>

  <!-- 答题区 -->
  <div id="quizArea" class="card quiz hidden">
    <div class="quiz-head">
      <span id="progress" class="progress"></span>
      <span id="qtype" class="tag single"></span>
    </div>
    <div class="bar"><div id="barFill" class="bar-fill"></div></div>
    <div id="stem" class="stem"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions">
      <button id="btnPrev" class="btn ghost" disabled>← 上一题</button>
      <button id="btnSubmit" class="btn primary">提交答案</button>
      <button id="btnNext" class="btn success" disabled>下一题 →</button>
    </div>
  </div>

  <!-- 结果区 -->
  <div id="resultArea" class="card result hidden"></div>
</div>

<!-- 记录弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>📊 做题记录</h3>
      <button class="close" id="btnCloseModal">×</button>
    </div>
    <div class="modal-body" id="recordsBody"></div>
    <div class="modal-foot">
      <button class="btn" id="btnExport">⬇️ 导出 CSV</button>
      <button class="btn danger" id="btnClearRecords">🗑️ 清空记录</button>
    </div>
  </div>
</div>

<!-- 提示 / 加载 -->
<div id="toast" class="toast"></div>
<div id="loading" class="loading hidden">
  <div class="spinner"></div>
  <div id="loadingText">处理中…</div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.pdf,.docx,.doc" class="hidden" />

<script>
/* =========================================================
   常量 & 工具
   ========================================================= */
const LS = {
  bank:        'stzb_bank_v1',
  bankName:    'stzb_bankname_v1',
  records:     'stzb_records_v1',
  name:        'stzb_name_v1',
  count:       'stzb_count_v1',
  mode:        'stzb_mode_v1',          // 'random' | 'sequential'
  seqProgress: 'stzb_seq_progress_v1'   // { bankName, current, answered, correct, answeredMap: {idx: bool} }
};
const MODE = { RANDOM: 'random', SEQUENTIAL: 'sequential' };
const PASSWORD = '6666';
const LETTERS = ['A','B','C','D','E'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function lsGet(k, d){
  try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
  catch(e){ return d; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ console.warn('本地存储写入失败', e); return false; }
}
function fmtTime(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtFileTime(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
}
function showLoading(text){
  $('loadingText').textContent = text || '处理中…';
  $('loading').classList.remove('hidden');
}
function hideLoading(){ $('loading').classList.add('hidden'); }

/* =========================================================
   全局状态
   ========================================================= */
let bank = [];            // [{stem, options:[{key,text}], answer}]
let bankName = '';
let queue = [];           // 本次练习题目（含打乱后的选项）
let current = 0;
let answered = 0;
let correct = 0;
let selection = new Set();
let submitted = false;
let finished = false;
let userName = '匿名';
let practiceCount = 10;
let mode = MODE.RANDOM;   // 当前刷题模式
let answeredMap = {};     // 顺序模式下记录已答题的结果 { queueIdx: 'ok' | 'wrong' }

function isInProgress(){
  if (!queue.length) return false;
  // 两种模式都需要至少答过一题才算进行中，避免还没开始答就弹 confirm
  return answered > 0 && current < queue.length;
}

function saveSeqProgress(){
  if (mode !== MODE.SEQUENTIAL) return;
  const data = {
    bankName,
    current,
    answered,
    correct,
    answeredMap
  };
  lsSet(LS.seqProgress, data);
}

function clearSeqProgress(){
  lsSet(LS.seqProgress, null);
}

function switchMode(newMode){
  if (newMode === mode) return;

  if (isInProgress()){
    const label = newMode === MODE.RANDOM ? '随机刷题' : '按顺序刷题';
    if (!confirm(`切换到「${label}」将重新开始练习，当前进度会丢失，确定继续吗？`)) return;
  }

  mode = newMode;
  lsSet(LS.mode, mode);
  updateModeButtons();
  updateCountField();
  updateModeInfo();

  if (bank.length > 0){
    startPractice();
  } else {
    const label = newMode === MODE.RANDOM ? '🎲 随机刷题' : '📖 按顺序刷题';
    toast(`已选择「${label}」，请上传题库开始`);
  }
}

function updateModeButtons(){
  const $random = $('btnModeRandom');
  const $seq = $('btnModeSeq');
  if (!$random || !$seq) return;

  // 无题库时两个按钮都不禁用（允许用户预先选择模式）
  if (mode === MODE.RANDOM){
    $random.classList.add('primary');
    $seq.classList.remove('primary');
  } else {
    $seq.classList.add('primary');
    $random.classList.remove('primary');
  }
  // 始终不禁用，让用户随时可切
  $random.disabled = false;
  $seq.disabled = false;
}

function updateCountField(){
  const input = $('countInput');
  const btn = $('btnCount');
  if (!input) return;
  if (mode === MODE.SEQUENTIAL){
    input.disabled = true;
    if (btn) btn.disabled = true;
    input.title = '顺序刷题模式使用完整题库';
  } else {
    input.disabled = false;
    if (btn) btn.disabled = false;
    input.title = '';
  }
}

/* =========================================================
   题库标准化（Excel 行 → 内部结构）
   ========================================================= */
function normalizeExcelRows(rows){
  const list = [];
  for (let i = 1; i < rows.length; i++){
    const r = rows[i] || [];
    const stem = String(r[0] ?? '').trim();
    if (!stem) continue;

    const options = [];
    for (let j = 0; j < 5; j++){
      const text = String(r[1 + j] ?? '').trim();
      if (text !== '') options.push({ key: LETTERS[j], text });
    }
    if (options.length < 2) continue;

    const rawAns = String(r[6] ?? '').toUpperCase();
    const answer = [...new Set(rawAns.replace(/[^A-E]/g, '').split(''))].sort().join('');
    if (!answer) continue;

    list.push({ stem, options, answer });
  }
  return list;
}

/* =========================================================
   文档（PDF / Word）文本 → 题目结构
   ========================================================= */
function splitMultiOptions(line){
  // 匹配形如 "A. xxx  B. xxx  C. xxx" 的一行多选项
  const re = /(?:^|[\s，,；;])([A-Ea-e])\s*[.、．)）:：]\s*/g;
  const marks = [];
  let m;
  while ((m = re.exec(line)) !== null){
    marks.push({ key: m[1].toUpperCase(), start: m.index, textStart: re.lastIndex });
    if (marks.length > 8) break;
  }
  if (marks.length < 2) return null;

  // 字母必须严格递增，避免误判
  for (let i = 1; i < marks.length; i++){
    if (marks[i].key.charCodeAt(0) <= marks[i - 1].key.charCodeAt(0)) return null;
  }

  const parts = [];
  for (let i = 0; i < marks.length; i++){
    const end = (i + 1 < marks.length) ? marks[i + 1].start : line.length;
    const text = line.slice(marks[i].textStart, end).trim().replace(/[，,；;]$/, '');
    if (text) parts.push({ key: marks[i].key, text });
  }
  return parts.length >= 2 ? parts : null;
}

function parseDocText(text){
  const rawLines = String(text || '').split(/\r?\n/);
  const lines = [];
  for (let l of rawLines){
    l = l.replace(/\u3000/g, ' ').replace(/[ \t]+/g, ' ').trim();
    if (l) lines.push(l);
  }

  const questions = [];
  let cur = null;

  const finalize = () => {
    if (cur){
      // 去重 + 排序
      const seen = new Set();
      cur.options = cur.options.filter(o => {
        if (!o.text || seen.has(o.key)) return false;
        seen.add(o.key);
        return true;
      }).sort((a, b) => a.key.localeCompare(b.key));

      if (cur.options.length >= 2 && cur.answer) questions.push(cur);
    }
    cur = null;
  };

  const ANS_RE = /^[【\[（(]?\s*(?:正确|参考|标准)?答案\s*[】\]）)]?\s*(?:是|为)?\s*[:：]?\s*([A-Ea-e][\s,、，;；A-Ea-e]*)$/;
  const OPT_RE = /^([A-Ea-e])\s*[.、．)）:：]\s*(.+)$/;
  const Q1_RE  = /^(?:第\s*)?(\d{1,3})\s*[.、．)）:：]\s*(.+)$/;
  const Q2_RE  = /^第\s*(\d{1,3})\s*题\s*[.、．:：]?\s*(.*)$/;

  for (const line of lines){
    // 1) 答案行
    let m = line.match(ANS_RE);
    if (m){
      const ans = [...new Set(m[1].replace(/[^A-Ea-e]/g, '').toUpperCase().split(''))].sort().join('');
      if (ans){
        if (cur) cur.answer = ans;
        else if (questions.length) questions[questions.length - 1].answer = ans;
        continue;
      }
    }

    // 2) 一行多选项
    const multi = splitMultiOptions(line);
    if (multi && cur){
      for (const o of multi) cur.options.push(o);
      continue;
    }

    // 3) 单选项行
    m = line.match(OPT_RE);
    if (m && cur){
      cur.options.push({ key: m[1].toUpperCase(), text: m[2].trim() });
      continue;
    }

    // 4) 新题号行
    m = line.match(Q1_RE) || line.match(Q2_RE);
    if (m){
      finalize();
      cur = { stem: (m[2] || '').trim(), options: [], answer: '' };
      continue;
    }

    // 5) 续行
    if (cur){
      if (cur.options.length === 0){
        cur.stem = (cur.stem + ' ' + line).trim();
      } else {
        const last = cur.options[cur.options.length - 1];
        last.text = (last.text + line).trim();
      }
    }
  }
  finalize();
  return questions;
}

/* =========================================================
   文件解析
   ========================================================= */
async function parseExcel(file){
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  if (!sheet) throw new Error('Excel 中没有工作表');
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
  const list = normalizeExcelRows(rows);
  if (!list.length){
    throw new Error('未能解析出题目。请检查格式：第一行为标题，之后每行为「题目、A、B、C、D、E、答案」');
  }
  return list;
}

async function parsePDF(file){
  if (!window.pdfjsLib) throw new Error('PDF 解析库加载失败，请检查网络后刷新重试');
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data }).promise;

  let text = '';
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lastY = null;
    for (const item of content.items){
      if (typeof item.str !== 'string') continue;
      const y = item.transform ? item.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 3) text += '\n';
      text += item.str;
      if (item.hasEOL) text += '\n';
      lastY = y;
    }
    text += '\n';
  }

  const list = parseDocText(text);
  if (!list.length){
    throw new Error('未能从 PDF 中识别出题目。请确认：① PDF 是文字版（非扫描图片）；② 题目包含题号、A/B/C/D 选项行和「答案：X」行。');
  }
  return list;
}

async function parseDocx(file){
  if (!window.mammoth) throw new Error('Word 解析库加载失败，请检查网络后刷新重试');
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  const list = parseDocText(result.value);
  if (!list.length){
    throw new Error('未能从 Word 文档中识别出题目。请确认：题目包含题号、A/B/C/D 选项行和「答案：X」行。');
  }
  return list;
}

async function parseFile(file){
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) return parseExcel(file);
  if (name.endsWith('.pdf'))  return parsePDF(file);
  if (name.endsWith('.docx')) return parseDocx(file);
  if (name.endsWith('.doc')){
    throw new Error('暂不支持旧版 .doc 格式，请用 Word 打开后「另存为 .docx」再上传');
  }
  throw new Error('不支持的文件格式，请上传 .xlsx / .xls / .pdf / .docx');
}

/* =========================================================
   题目构建 & 渲染
   ========================================================= */
function buildQuestion(q){
  const isMulti = q.answer.length > 1;
  const opts = q.options.slice();

  // 有效选项 ≥3 随机打乱；=2 视为判断题，保持原顺序
  const ordered = opts.length >= 3 ? shuffle(opts.slice()) : opts.slice();

  let type = '单选题';
  if (opts.length === 2) type = '判断题';
  else if (isMulti) type = '多选题';

  return { stem: q.stem, type, options: ordered, answer: q.answer, isMulti };
}

function renderQuestion(){
  if (!queue.length) return;
  if (current >= queue.length){ finishPractice(); return; }

  const q = queue[current];

  // 顺序模式：检查当前题是否已答过，已答则自动恢复"已提交"状态
  const prevResult = answeredMap[current];
  if (mode === MODE.SEQUENTIAL && prevResult){
    submitted = true;
    selection = new Set();  // 选项不可再选
  } else {
    submitted = false;
    selection = new Set();
  }

  $('progress').textContent = `第 ${current + 1} / ${queue.length} 题`;
  const tag = $('qtype');
  tag.textContent = `【${q.type}】`;
  tag.className = 'tag ' + (q.type === '多选题' ? 'multi' : q.type === '判断题' ? 'judge' : 'single');

  $('stem').textContent = q.stem;
  $('barFill').style.width = (current / queue.length * 100) + '%';

  const box = $('options');
  box.innerHTML = '';

  q.options.forEach((opt, i) => {
    const label = String.fromCharCode(65 + i);   // 标签动态分配 A/B/C...
    const wrap = document.createElement('label');
    wrap.className = 'option';

    const input = document.createElement('input');
    input.type = q.isMulti ? 'checkbox' : 'radio';
    input.name = 'opt';
    input.value = opt.key;                        // 记录原始选项字母，用于判分
    input.addEventListener('change', () => {
      if (submitted) return;
      if (q.isMulti){
        if (input.checked) selection.add(opt.key);
        else selection.delete(opt.key);
      } else {
        selection = new Set([opt.key]);
      }
    });

    const lab = document.createElement('span');
    lab.className = 'opt-label';
    lab.textContent = label;

    const txt = document.createElement('span');
    txt.className = 'opt-text';
    txt.textContent = opt.text;

    wrap.append(input, lab, txt);
    box.appendChild(wrap);
  });

  const fb = $('feedback');

  if (submitted){
    // 已提交状态：显示正确/错误高亮 + 解析
    document.querySelectorAll('#options .option').forEach(el => {
      const input = el.querySelector('input');
      const k = input.value;
      const isAns = q.answer.includes(k);
      if (isAns) el.classList.add('correct');
      input.disabled = true;
    });

    const isOk = prevResult === 'ok' || prevResult === true;
    fb.className = 'feedback ' + (isOk ? 'ok' : 'bad');
    if (isOk){
      fb.innerHTML = '✅ 回答正确！';
    } else {
      const rightLabels = q.options
        .map((o, i) => q.answer.includes(o.key) ? String.fromCharCode(65 + i) : null)
        .filter(Boolean).join('、');
      fb.innerHTML = `❌ 回答错误，正确答案：<b>${esc(q.answer)}</b>（选项 ${esc(rightLabels)}）`;
    }
  } else {
    fb.className = 'feedback hidden';
    fb.innerHTML = '';
  }

  updateNavButtons();
}

function updateNavButtons(){
  // 上一题按钮：仅顺序模式可用 && 非第一题
  $('btnPrev').disabled = (mode !== MODE.SEQUENTIAL) || (current <= 0);

  if (submitted){
    $('btnSubmit').disabled = true;
    $('btnNext').disabled = false;  // 提交后始终可点击，最后一题点了会 finish
    $('btnNext').textContent = (current === queue.length - 1) ? '完成练习 ✓' : '下一题 →';
  } else {
    $('btnSubmit').disabled = false;
    $('btnNext').disabled = true;
    $('btnNext').textContent = '下一题 →';
  }
}

function submitAnswer(){
  if (submitted || current >= queue.length) return;
  const q = queue[current];
  if (selection.size === 0){ toast('请先选择答案'); return; }

  const sel = [...selection].sort().join('');
  const ok = sel === q.answer;

  // 顺序模式去重计数：只有首次作答才计入 answered/correct
  const isSeqFirst = (mode === MODE.SEQUENTIAL && !answeredMap[current]);

  submitted = true;
  if (isSeqFirst){
    answered++;
    if (ok) correct++;
    answeredMap[current] = ok ? 'ok' : 'wrong';
    saveSeqProgress();
  } else if (mode === MODE.RANDOM){
    answered++;
    if (ok) correct++;
  }

  document.querySelectorAll('#options .option').forEach(el => {
    const input = el.querySelector('input');
    const k = input.value;
    const isAns = q.answer.includes(k);
    const isSel = selection.has(k);
    if (isAns) el.classList.add('correct');
    else if (isSel) el.classList.add('wrong');
    input.disabled = true;
  });

  const fb = $('feedback');
  if (ok){
    fb.className = 'feedback ok';
    fb.innerHTML = '✅ 回答正确！';
  } else {
    const rightLabels = q.options
      .map((o, i) => q.answer.includes(o.key) ? String.fromCharCode(65 + i) : null)
      .filter(Boolean).join('、');
    fb.className = 'feedback bad';
    fb.innerHTML = `❌ 回答错误，正确答案：<b>${esc(q.answer)}</b>（选项 ${esc(rightLabels)}）`;
  }

  updateNavButtons();
  updateModeInfo();
}

function nextQuestion(){
  if (!submitted) return;

  if (mode === MODE.SEQUENTIAL){
    saveSeqProgress();
  }

  current++;
  if (current >= queue.length) finishPractice();
  else renderQuestion();
}

function prevQuestion(){
  if (mode !== MODE.SEQUENTIAL) return;
  if (current <= 0) return;

  saveSeqProgress();
  current--;
  renderQuestion();
}

/* =========================================================
   练习流程
   ========================================================= */
function startPractice(){
  if (!bank.length){ toast('请先上传题库'); return; }

  finished = false;
  answered = 0;
  correct = 0;
  answeredMap = {};
  submitted = false;

  if (mode === MODE.RANDOM){
    // ---- 随机刷题：抽取 practiceCount 道 ----
    let n = parseInt(practiceCount, 10);
    if (!n || n < 1) n = 1;
    n = Math.min(n, bank.length);

    const pool = Array.from({ length: bank.length }, (_, i) => i);
    shuffle(pool);
    queue = pool.slice(0, n).map(i => ({
      ...buildQuestion(bank[i]),
      _bankIdx: i  // 标记题库原始索引
    }));
    current = 0;

  } else {
    // ---- 顺序刷题：完整题库 + 进度恢复 ----
    queue = bank.map((q, i) => ({
      ...buildQuestion(q),
      _bankIdx: i
    }));

    // 尝试恢复进度（仅限同一题库）
    const saved = lsGet(LS.seqProgress, null);
    if (saved && saved.bankName === bankName &&
        typeof saved.current === 'number' && saved.current < queue.length){
      current = saved.current;
      answered = saved.answered || 0;
      correct = saved.correct || 0;
      answeredMap = saved.answeredMap || {};
      toast('🔄 已恢复上次练习进度');
    } else {
      current = 0;
      clearSeqProgress();
    }
  }

  $('resultArea').classList.add('hidden');
  $('emptyTip').classList.add('hidden');
  $('quizArea').classList.remove('hidden');

  updateModeInfo();
  renderQuestion();
}

function finishPractice(){
  if (finished) return;
  finished = true;

  const total = queue.length;
  const rate = total ? Math.round(correct / total * 1000) / 10 : 0;

  // 自动保存记录
  const rec = {
    name: userName,
    count: total,
    correct: correct,
    rate: rate,
    time: fmtTime(new Date()),
    mode: mode === MODE.RANDOM ? '随机' : '顺序'
  };
  const records = lsGet(LS.records, []);
  records.unshift(rec);
  lsSet(LS.records, records);

  // 顺序模式完成时清除进度
  if (mode === MODE.SEQUENTIAL) clearSeqProgress();

  renderResult(total, rate);
}

function renderResult(total, rate){
  $('quizArea').classList.add('hidden');
  const ra = $('resultArea');
  ra.classList.remove('hidden');
  const againText = mode === MODE.RANDOM ? '再来一组' : '再刷一遍';
  const exitText = mode === MODE.SEQUENTIAL ? '继续上次进度' : null;

  ra.innerHTML = `
    <h2>🎉 练习完成</h2>
    <div class="score-line"><span class="score">${correct}</span> / ${total}</div>
    <div class="rate">正确率 ${rate}%</div>
    <div class="result-meta">${esc(userName)} · ${esc(mode === MODE.RANDOM ? '随机' : '顺序')}模式 · ${total} 题 · ${fmtTime(new Date())}</div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
      ${exitText ? `<button class="btn" id="btnExit" style="min-width:160px;">📖 ${exitText}</button>` : ''}
      <button class="btn primary" id="btnAgain" style="min-width:160px;">${againText}</button>
    </div>
  `;
  $('btnAgain').onclick = () => { clearSeqProgress(); startPractice(); };
  const $exit = $('btnExit');
  if ($exit) $exit.onclick = () => { clearSeqProgress(); startPractice(); };
}

function updateModeInfo(){
  const el = $('modeInfo');
  if (!el) return;
  if (mode === MODE.RANDOM){
    el.textContent = '🎲 随机模式';
  } else {
    const saved = lsGet(LS.seqProgress, null);
    const hasProgress = saved && saved.bankName === bankName && queue.length > 0;
    if (hasProgress){
      el.textContent = `📖 顺序模式 · 已答 ${answered}/${queue.length}`;
    } else {
      el.textContent = '📖 顺序模式';
    }
  }
}

/* =========================================================
   题库信息 / 上传
   ========================================================= */
function updateBankInfo(){
  const el = $('bankInfo');
  if (!bank.length){
    el.textContent = '尚未加载题库';
    el.className = 'bank-info';
    return;
  }
  el.className = 'bank-info ok';
  el.textContent = `📚 ${bankName} · 共 ${bank.length} 题`;
}

async function handleFile(file){
  showLoading('正在解析题库，请稍候…');
  try{
    const list = await parseFile(file);
    if (!list.length) throw new Error('没有解析到有效题目');

    bank = list;
    bankName = file.name;
    lsSet(LS.bank, bank);
    lsSet(LS.bankName, bankName);

    // 切换题库必须清除旧顺序进度，防止 index 越界
    clearSeqProgress();

    updateBankInfo();

    if (practiceCount > bank.length) practiceCount = bank.length;
    $('countInput').value = practiceCount;
    $('countInput').max = bank.length;

    startPractice();
    toast(`✅ 题库加载成功，共 ${bank.length} 题`);
  } catch (err){
    console.error(err);
    alert('解析失败：' + (err && err.message ? err.message : err));
  } finally {
    hideLoading();
  }
}

/* =========================================================
   做题记录

function openRecords(){
  const records = lsGet(LS.records, []);
  const body = $('recordsBody');

  if (!records.length){
    body.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:26px 0;">暂无做题记录</p>';
  } else {
    body.innerHTML = `
      <table>
        <thead>
          <tr><th>姓名</th><th>练习数量</th><th>答对数</th><th>正确率</th><th>完成时间</th></tr>
        </thead>
        <tbody>
          ${records.map(r => `
            <tr>
              <td>${esc(r.name)}</td>
              <td>${esc(r.count)}</td>
              <td>${esc(r.correct)}</td>
              <td style="color:#0f766e;font-weight:600;">${esc(r.rate)}%</td>
              <td style="color:#94a3b8;">${esc(r.time)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
  $('modal').classList.remove('hidden');
}

function csvCell(v){
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportRecords(){
  const records = lsGet(LS.records, []);
  if (!records.length){ toast('暂无记录可导出'); return; }

  const head = ['姓名', '练习数量', '答对数', '正确率', '完成时间'];
  const rows = records.map(r => [r.name, r.count, r.correct, r.rate + '%', r.time]);
  const csv = '\ufeff' + [head, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `做题记录_${fmtFileTime(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出 CSV 文件');
}

    nextQuestion();
  }
});

/* =========================================================
   初始化
   ========================================================= */
function init(){
  // 姓名
  const savedName = lsGet(LS.name, '匿名');
  userName = (typeof savedName === 'string' && savedName.trim()) ? savedName.trim() : '匿名';
  $('nameInput').value = userName;

  // 练习数量
  let savedCount = parseInt(lsGet(LS.count, 10), 10);
  if (!savedCount || savedCount < 1) savedCount = 10;
  practiceCount = savedCount;
  $('countInput').value = savedCount;

  // 模式
  const savedMode = lsGet(LS.mode, MODE.RANDOM);
  mode = (savedMode === MODE.SEQUENTIAL) ? MODE.SEQUENTIAL : MODE.RANDOM;

  // 题库
  const savedBank = lsGet(LS.bank, null);
  if (Array.isArray(savedBank) && savedBank.length){
    bank = savedBank;
    const savedNameBank = lsGet(LS.bankName, '');
    bankName = (typeof savedNameBank === 'string' && savedNameBank) ? savedNameBank : '上次使用的题库';

    if (practiceCount > bank.length) practiceCount = bank.length;
    $('countInput').value = practiceCount;
    $('countInput').max = bank.length;

    updateBankInfo();
    updateModeButtons();
    updateCountField();
    startPractice();
  } else {
    // 无题库时，也要初始化模式按钮，隐藏上一题
    updateModeButtons();
    updateCountField();
    $('btnPrev').disabled = true;
    $('emptyTip').classList.remove('hidden');
    $('quizArea').classList.add('hidden');
  }
}

init();
</script>
</body>
</html>
